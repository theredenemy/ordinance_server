<!DOCTYPE html>
<html>
<body>
    <div class="header"><h1>USERS</h1></div>
    <div class="container">
        <form method="post">
            Username <input name="username"/> 
            Password <input type="password" name="password"/>
            <button type="submit" class="btn-add">ADD</button>
        </form>

        <table>
            <tr><th>Username</th><th></th></tr>
            {% for username in users %}
            <tr>
                <td><strong>{{ username['username'] }}</strong></td>
                <td><a href="/admin/users?delete={{ username['username'] }}" class="btn-del" onclick="return confirm('Delete?')">Delete</a></td>
               <td><a href="/admin/users/password?user={{ username['username'] }}" class="btn-change">Change Password</a></td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
