<!DOCTYPE html>
<html>
<body>
    <div class="header"><h1>CHATBOT</h1></div>
    <div class="container">
        <form method="post">
            Message <input name="message"/> 
            Command <input name="cmd"/>
            Send_Message <input type="checkbox" name="send_msg" checked/>
            <button type="submit" class="btn-add">ADD</button>
        </form>

        <table>
            <tr><th>Message</th><th></th><th>Command</th><th></th><th>Send_Message</th><th></th></tr>
            {% for message_t, cmd, send_msg in commands %}
            <tr>
                <td><strong>{{ message_t }}</strong></td>
                <td><code>&nbsp;&nbsp;&nbsp;&nbsp;</code></td>
                <td><code>{{ cmd }}</code></td>
                <td><code>&nbsp;&nbsp;&nbsp;&nbsp;</code></td>
                {% if send_msg == 1 %}
                    <td><code>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;True</code></td>
                {% else %}
                    <td><code>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;False</code></td>
                {% endif %}
                <td><code>&nbsp;&nbsp;&nbsp;&nbsp;</code></td>
                <td><a href="/ord/chat/admin?delete={{ message_t }}" class="btn-del" onclick="return confirm('Delete?')">Delete</a></td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
